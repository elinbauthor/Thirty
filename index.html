    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap');
    .t-root {
      --ink:#2B1A34; --ground:#F4EFF3; --card:#FFFFFF;
      --plum:#6B3A6E; --deep:#3A1C3D; --soft:#C098C3;
      --flame:#FF6A2B; --onflame:#3D1300;
      --rule:#DFD2E0; --muted:#6F5B73; --warn:#A8465E;
      background:var(--ground); color:var(--ink); min-height:100vh;
      font-family:"Inter",-apple-system,"Segoe UI",sans-serif;
      font-size:15px; line-height:1.5; padding-bottom:56px;
      font-variant-numeric:tabular-nums;
    }
    .t-wrap { max-width:560px; margin:0 auto; padding:0 18px; }
    .t-bar-top { position:sticky; top:0; z-index:30; background:var(--ground);
      border-bottom:1px solid var(--rule); }
    .t-head { display:flex; align-items:center; justify-content:space-between;
      gap:10px; padding:16px 0 10px; }
    .t-brand { display:flex; align-items:center; gap:10px; min-width:0; }
    .t-logo { font-family:"Archivo",sans-serif; font-weight:800; font-size:23px;
      letter-spacing:-0.035em; margin:0; }
    .t-sub { font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
      color:var(--muted); text-align:right; flex:0 0 auto; line-height:1.35; }
    .t-tabs { display:flex; gap:2px; overflow-x:auto; flex-wrap:nowrap;
      -webkit-overflow-scrolling:touch; }
    .t-tab { background:none; border:none; border-bottom:2px solid transparent;
      padding:10px 13px; font:inherit; font-size:14px; color:var(--muted);
      cursor:pointer; margin-bottom:-1px; flex:0 0 auto; white-space:nowrap; }
    .t-tab[data-on="1"] { color:var(--ink); border-bottom-color:var(--plum); font-weight:600; }
    .t-tab:focus-visible, .t-btn:focus-visible, .t-chip:focus-visible,
    input:focus-visible, textarea:focus-visible, .t-mini:focus-visible {
      outline:2px solid var(--flame); outline-offset:2px; }
    .t-bar-top + .t-wrap { padding-top:18px; }

    .t-card { background:var(--card); border:1px solid var(--rule); border-radius:3px;
      padding:16px; margin-bottom:14px; }
    .t-lab { font-size:11px; letter-spacing:0.11em; text-transform:uppercase;
      color:var(--muted); display:block; margin-bottom:9px; }
    .t-h2 { font-family:"Archivo",sans-serif; font-weight:700; font-size:19px;
      letter-spacing:-0.02em; margin:0 0 10px; }
    .t-note { color:var(--muted); font-size:13.5px; max-width:52ch; }
    .t-alert { background:#F7E4EA; border-left:3px solid var(--warn); color:var(--warn);
      padding:12px 14px; margin-bottom:14px; font-size:13.5px; border-radius:3px; }

    .t-btn { background:var(--plum); color:#fff; border:none; padding:13px 20px;
      font:inherit; font-weight:600; cursor:pointer; border-radius:3px; }
    .t-btn-flame { background:var(--flame); color:var(--onflame); }
    .t-btn-wide { width:100%; }
    .t-mini { border:none; background:none; color:var(--muted); font:inherit;
      font-size:12.5px; cursor:pointer; text-decoration:underline; padding:4px 0; }
    .t-chip { border:1px solid var(--rule); background:none; color:var(--ink);
      padding:10px 14px; font:inherit; font-size:14px; cursor:pointer; border-radius:3px; }
    .t-chip[data-on="1"] { background:var(--plum); border-color:var(--plum); color:#fff; }
    .t-chips { display:flex; gap:8px; flex-wrap:wrap; }
    .t-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    /* what's left \u2014 the loudest thing in the app */
    .t-left { background:var(--flame); color:var(--onflame); border-radius:3px;
      padding:18px; margin-bottom:14px; }
    .t-left .t-lab { color:var(--onflame); opacity:0.72; }
    .t-leftitem { font-family:"Archivo",sans-serif; font-weight:800; font-size:23px;
      letter-spacing:-0.03em; line-height:1.25; margin:3px 0; }
    .t-done { background:var(--plum); color:#fff; border-radius:3px; padding:20px 18px;
      margin-bottom:14px; }
    .t-catchup { background:var(--card); border:1px solid var(--flame); border-left:4px solid var(--flame);
      border-radius:3px; padding:16px 18px; margin-bottom:14px; }
    .t-catchline { font-family:"Archivo",sans-serif; font-weight:800; font-size:20px;
      letter-spacing:-0.03em; margin:2px 0 6px; }
    .t-catchnote { font-size:13.5px; color:var(--muted); max-width:46ch; }
    .t-editing { background:var(--deep); color:var(--soft); border-radius:3px;
      padding:11px 14px; margin-bottom:14px; font-size:13px;
      display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .t-editing .t-mini { color:#FFFFFF; }
    .t-done .t-lab { color:var(--soft); }
    .t-doneline { font-family:"Archivo",sans-serif; font-weight:800; font-size:30px;
      letter-spacing:-0.035em; margin:2px 0 6px; }
    .t-donenote { font-size:13.5px; color:var(--soft); }

    .t-task { border-bottom:1px solid var(--rule); padding:14px 0; }
    .t-task:last-child { border-bottom:none; padding-bottom:0; }
    .t-taskhead { display:flex; justify-content:space-between; align-items:baseline;
      gap:10px; margin-bottom:9px; }
    .t-taskname { font-weight:600; font-size:14.5px; }
    .t-taskval { font-size:13px; color:var(--muted); }
    .t-taskval[data-hit="1"] { color:var(--plum); font-weight:600; }
    .t-bar { height:8px; background:var(--ground); border:1px solid var(--rule);
      border-radius:4px; overflow:hidden; margin-bottom:10px; }
    .t-bar div { height:100%; }

    .t-entries { display:flex; justify-content:space-between; align-items:center;
      gap:12px; font-size:12.5px; color:var(--muted); margin-top:2px; }
    .t-entries span { min-width:0; word-break:break-word; }

    .t-add { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
    .t-add .t-input { flex:1 1 0; min-width:0; }
    .t-add .t-btn { padding:10px 18px; flex:0 0 auto; }
    .t-unit { font-size:13px; color:var(--muted); flex:0 0 auto; }

    .t-input { width:100%; font:inherit; font-size:14px; background:var(--card);
      border:1px solid var(--rule); color:var(--ink); padding:10px;
      border-radius:3px; box-sizing:border-box; }
    textarea.t-input { min-height:74px; resize:vertical; }

    .t-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:7px; margin:4px 0 6px; }
    .t-cell { aspect-ratio:1; border-radius:3px; background:var(--ground);
      border:1px solid var(--rule); display:flex; align-items:center;
      justify-content:center; font-size:11px; color:var(--muted); }
    .t-cell[data-s="done"] { background:var(--plum); border-color:var(--plum); color:#fff; font-weight:600; }
    .t-cell[data-s="pass"] { background:var(--card); border:2px solid var(--flame); color:var(--flame); font-weight:600; }
    .t-cell[data-s="today"] { border:2px solid var(--flame); background:var(--card); color:var(--ink); font-weight:700; }
    .t-cell[data-s="future"] { opacity:0.5; }

    .t-why { background:var(--deep); color:var(--soft); border-radius:3px;
      padding:15px 16px; font-size:14px; margin-bottom:14px; }
    .t-why strong { color:#fff; font-weight:500; display:block; margin-top:4px;
      font-size:15.5px; line-height:1.45; }

    .t-ledger { font-size:13.5px; }
    .t-ledger div { padding:9px 0; border-bottom:1px solid var(--rule); }
    .t-ledger div:last-child { border-bottom:none; }
    .t-pass { display:flex; gap:6px; margin:2px 0 10px; }
    .t-pip { width:26px; height:8px; border-radius:4px; background:var(--flame); }
    .t-pip[data-spent="1"] { background:var(--rule); }

    .t-notes div { padding:12px 0; border-bottom:1px solid var(--rule); }
    .t-notes div:last-child { border-bottom:none; }
    .t-noteday { font-size:11px; letter-spacing:0.09em; text-transform:uppercase;
      color:var(--muted); display:block; margin-bottom:3px; }

    .t-set { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
    .t-set label { font-size:13px; width:96px; color:var(--muted); flex:0 0 auto; }
    .t-set input { flex:1 1 0; min-width:0; font:inherit; font-size:14px;
      background:var(--card); border:1px solid var(--rule); color:var(--ink);
      padding:9px 10px; border-radius:3px; }

    .t-confetti { position:fixed; inset:0; pointer-events:none; z-index:80; overflow:hidden; }
    .t-confetti span { position:absolute; top:-20px; border-radius:1px;
      animation-name:t-fall; animation-timing-function:linear; animation-fill-mode:forwards; }
    @keyframes t-fall {
      to { transform:translateY(105vh) rotate(540deg); opacity:0.15; }
    }
    @media (prefers-reduced-motion:reduce) {
      .t-confetti { display:none; }
      * { transition:none !important; }
    }
    @media (max-width:420px) {
      .t-wrap { padding:0 13px; }
      .t-logo { font-size:21px; }
      .t-leftitem { font-size:20px; }
      .t-doneline { font-size:26px; }
      .t-grid { gap:5px; }
